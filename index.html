<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kenyagram</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            color: #111;
        }

        /* NAVBAR */
        .navbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-create {
            border: none;
            background: #111;
            color: white;
            padding: 9px 17px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        /* FEED */
        .feed {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .post {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .post-header {
            padding: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff9800, #e91e63, #673ab7);
        }

        .post-media {
            width: 100%;
            max-height: 700px;
            object-fit: contain;
            background: black;
        }

        .post-actions {
            padding: 12px;
            display: flex;
            gap: 15px;
        }

        .post-actions button {
            border: none;
            background: none;
            font-size: 24px;
            cursor: pointer;
        }

        .caption {
            padding: 0 13px 15px;
        }

        /* MODAL */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .create-box {
            width: 95%;
            max-width: 900px;
            height: 650px;
            background: white;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .create-header {
            height: 55px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            font-weight: bold;
        }

        .create-header button {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 22px;
        }

        .create-body {
            flex: 1;
            display: flex;
        }

        /* SELECT AREA */
        .select-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            padding: 20px;
        }

        .upload-icon {
            font-size: 65px;
        }

        .select-title {
            font-size: 22px;
        }

        .select-button {
            background: #0095f6;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .select-button:hover {
            background: #0077c8;
        }

        #fileInput {
            display: none;
        }

        /* EDIT AREA */
        .edit-area {
            display: none;
            flex: 1;
        }

        .preview-area {
            width: 60%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-area img,
        .preview-area video {
            max-width: 100%;
            max-height: 590px;
            object-fit: contain;
        }

        .details-area {
            width: 40%;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .caption-input {
            width: 100%;
            height: 130px;
            border: none;
            outline: none;
            resize: none;
            font-size: 15px;
            font-family: inherit;
        }

        .post-button {
            margin-top: auto;
            width: 100%;
            padding: 12px;
            border: none;
            background: #0095f6;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button {
            margin-bottom: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 15px;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .create-box {
                width: 100%;
                height: 100%;
                border-radius: 0;
            }

            .create-body {
                display: block;
            }

            .preview-area {
                width: 100%;
                height: 55%;
            }

            .details-area {
                width: 100%;
                height: 45%;
            }

            .feed {
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="logo">Kenyagram</div>

        <button class="nav-create" onclick="openCreate()">
            ＋ Create
        </button>
    </nav>


    <!-- FEED -->
    <main class="feed" id="feed">

        <div class="post">

            <div class="post-header">
                <div class="avatar"></div>
                <span>Kenyagram</span>
            </div>

            <img
                class="post-media"
                src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3"
                alt="Example post"
            >

            <div class="post-actions">
                <button>♡</button>
                <button>💬</button>
                <button>↗</button>
            </div>

            <div class="caption">
                <strong>Kenyagram</strong>
                Welcome to Kenyagram 🇰🇪
            </div>

        </div>

    </main>


    <!-- CREATE POST MODAL -->
    <div class="modal" id="createModal">

        <div class="create-box">

            <div class="create-header">

                <button onclick="closeCreate()">×</button>

                <span>Create new post</span>

                <span></span>

            </div>


            <div class="create-body">

                <!-- SELECT FILE -->
                <div class="select-area" id="selectArea">

                    <div class="upload-icon">🖼️</div>

                    <div class="select-title">
                        Create a new post
                    </div>

                    <div>
                        Choose a photo or video from your device
                    </div>

                    <button
                        class="select-button"
                        onclick="chooseFile()"
                    >
                        Select from device
                    </button>

                    <input
                        type="file"
                        id="fileInput"
                        accept="image/*,video/*"
                        onchange="previewFile(event)"
                    >

                </div>


                <!-- PREVIEW + DETAILS -->
                <div class="edit-area" id="editArea">

                    <div class="preview-area" id="previewArea">
                    </div>

                    <div class="details-area">

                        <button
                            class="back-button"
                            onclick="goBack()"
                        >
                            ← Back
                        </button>

                        <div class="user-info">

                            <div class="avatar"></div>

                            <span>Kenyagram User</span>

                        </div>

                        <textarea
                            id="caption"
                            class="caption-input"
                            placeholder="Write a caption..."
                        ></textarea>

                        <button
                            class="post-button"
                            onclick="publishPost()"
                        >
                            Share
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


<script>

    let selectedFile = null;
    let previewURL = null;


    /* OPEN CREATE */

    function openCreate() {

        document
            .getElementById("createModal")
            .classList.add("active");

    }


    /* CLOSE CREATE */

    function closeCreate() {

        document
            .getElementById("createModal")
            .classList.remove("active");

        resetCreate();

    }


    /* SELECT FILE */

    function chooseFile() {

        document
            .getElementById("fileInput")
            .click();

    }


    /* PREVIEW FILE */

    function previewFile(event) {

        const file = event.target.files[0];

        if (!file) return;

        selectedFile = file;

        previewURL = URL.createObjectURL(file);

        const previewArea =
            document.getElementById("previewArea");

        previewArea.innerHTML = "";

        if (file.type.startsWith("video/")) {

            const video =
                document.createElement("video");

            video.src = previewURL;

            video.controls = true;

            video.autoplay = true;

            video.muted = true;

            previewArea.appendChild(video);

        }

        else if (file.type.startsWith("image/")) {

            const image =
                document.createElement("img");

            image.src = previewURL;

            previewArea.appendChild(image);

        }

        document
            .getElementById("selectArea")
            .style.display = "none";

        document
            .getElementById("editArea")
            .style.display = "flex";

    }


    /* GO BACK */

    function goBack() {

        resetCreate();

    }


    /* RESET */

    function resetCreate() {

        selectedFile = null;

        if (previewURL) {

            URL.revokeObjectURL(previewURL);

        }

        previewURL = null;

        document
            .getElementById("previewArea")
            .innerHTML = "";

        document
            .getElementById("caption")
            .value = "";

        document
            .getElementById("selectArea")
            .style.display = "flex";

        document
            .getElementById("editArea")
            .style.display = "none";

        document
            .getElementById("fileInput")
            .value = "";

    }


    /* PUBLISH */

    function publishPost() {

        if (!selectedFile) return;

        const caption =
            document
                .getElementById("caption")
                .value;

        const post =
            document.createElement("div");

        post.className = "post";


        /* HEADER */

        const header =
            document.createElement("div");

        header.className = "post-header";

        header.innerHTML = `
            <div class="avatar"></div>
            <span>Kenyagram User</span>
        `;


        /* MEDIA */

        let media;

        if (selectedFile.type.startsWith("video/")) {

            media =
                document.createElement("video");

            media.controls = true;
            media.className = "post-media";

        } else {

            media =
                document.createElement("img");

            media.className = "post-media";

        }

        media.src = previewURL;


        /* ACTIONS */

        const actions =
            document.createElement("div");

        actions.className = "post-actions";

        actions.innerHTML = `
            <button>♡</button>
            <button>💬</button>
            <button>↗</button>
        `;


        /* CAPTION */

        const captionElement =
            document.createElement("div");

        captionElement.className = "caption";

        captionElement.innerHTML =
            `<strong>Kenyagram User</strong> ${
                escapeHTML(caption)
            }`;


        post.appendChild(header);
        post.appendChild(media);
        post.appendChild(actions);
        post.appendChild(captionElement);


        document
            .getElementById("feed")
            .prepend(post);


        closeCreate();

    }


    /* SECURITY */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }

</script>

</body>
</html>
